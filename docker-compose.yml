services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portale
      POSTGRES_USER: portale
      POSTGRES_PASSWORD: portale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portale"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://portale:portale@db:5432/portale
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      SITE_URL: ${SITE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_BATCH_SIZE: ${MAIL_BATCH_SIZE:-50}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-500}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin@samtrevano.ch}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

volumes:
  pgdata:
