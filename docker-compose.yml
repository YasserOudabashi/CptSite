services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portale
      POSTGRES_USER: portale
      POSTGRES_PASSWORD: portale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portale"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://portale:portale@db:5432/portale
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src

volumes:
  pgdata:
